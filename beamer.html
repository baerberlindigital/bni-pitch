<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bären-Pitch Beamer</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #141417;
    --kachel: #1b1b1e;
    --kachel-aktiv: #2a2a30;
    --gruen: #1fa855;
    --gelb: #f5d000;
    --rot: #ff3b4a;
    --grau: #8a8a92;
    --header: #b91c2c;
    --text: #f4f4f6;
    --leise: #a8a8b0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  body.ohne-maus, body.ohne-maus * { cursor: none !important; }

  .buehne {
    display: grid;
    grid-template-columns: 58fr 42fr;
    gap: 2vw;
    width: 100vw;
    height: 100vh;
    padding: 2.5vh 2vw;
  }

  /* ---------- links: Liste ---------- */
  .links {
    position: relative;
    min-width: 0;
    min-height: 0;
    border-radius: 1.6vh;
    background: var(--panel);
    overflow: hidden;
  }
  .liste {
    position: relative;
    height: 100%;
    overflow: hidden;
    padding: 30vh 2vw 64vh;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 95%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 95%, transparent 100%);
  }
  .gruppe-titel {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin: 4vh 0 1.8vh;
    font-size: 2.4vh;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #c4c4ca;
  }
  .gruppe-titel .anzahl { font-weight: 500; color: #7a7a82; letter-spacing: 0; }
  .liste .leer { font-size: 2.6vh; color: #777; margin-bottom: 2vh; }

  .pitch {
    display: flex;
    align-items: center;
    gap: 1.8vw;
    padding: 1.8vh 1.6vw 1.8vh 1.4vw;
    margin-bottom: 1.4vh;
    border-radius: 1.6vh;
    background: var(--kachel);
    border-left: 0.8vh solid var(--akzent, var(--grau));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    opacity: 0.85;
    transition: opacity 0.35s ease, background 0.35s ease, box-shadow 0.35s ease;
  }
  .pitch.g-baeren { --akzent: var(--gruen); }
  .pitch.g-vertretungen { --akzent: var(--gelb); }
  .pitch.g-gaeste { --akzent: var(--grau); }

  .pitch .nr {
    flex: 0 0 auto;
    min-width: 5.6vh;
    height: 5.6vh;
    padding: 0 1vh;
    border-radius: 2.8vh;
    background: #2e2e34;
    color: #d6d6db;
    font-size: 2.6vh;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pitch .inhalt { min-width: 0; flex: 1 1 auto; }
  .pitch .name {
    font-size: 4vh;
    font-weight: 700;
    line-height: 1.2;
    overflow-wrap: break-word;
  }
  .pitch .zeile2 {
    margin-top: 0.5vh;
    font-size: 2.4vh;
    color: var(--leise);
    overflow-wrap: break-word;
  }
  .pitch .zeile2 strong { color: #e4e4e8; font-weight: 600; }

  .pitch.erledigt { opacity: 0.3; }
  .pitch.aktiv {
    opacity: 1;
    background: var(--kachel-aktiv);
    box-shadow: 0 1vh 3vh rgba(0,0,0,0.6), inset 0 0 0 0.4vh rgba(255,255,255,0.9);
    padding-top: 2.6vh;
    padding-bottom: 2.6vh;
  }
  .pitch.aktiv .nr { background: var(--akzent, #fff); color: #0a0a0c; }
  .pitch.aktiv .name { font-size: 5.4vh; }
  .pitch.aktiv .zeile2 { font-size: 3.1vh; color: #d0d0d6; }

  /* ---------- rechts: Timer + Steuerung ---------- */
  .rechts {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 1vh 0;
  }
  .timer-block {
    position: relative;
    top: 3vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2vh;
    width: 100%;
  }
  .timer {
    --tfarbe: var(--gruen);
    position: relative;
    width: min(54vh, 36vw);
    aspect-ratio: 1;
  }
  .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer .spur { fill: none; stroke: #26262b; stroke-width: 8; }
  .timer .fortschritt {
    fill: none;
    stroke: var(--tfarbe);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 565.49;
    stroke-dashoffset: 0;
    transition: stroke 0.3s ease;
  }
  .timer .zahl {
    position: absolute;
    left: 0;
    right: 0;
    top: 55%;
    bottom: 17%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15vh;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--tfarbe);
    line-height: 1;
    transition: color 0.3s ease;
  }
  /* Bär: weiße Outline, weißes Netzwerk wächst von außen nach innen */
  .baer {
    position: absolute;
    left: 20%;
    top: 19%;
    width: 60%;
    aspect-ratio: 1000 / 565;
  }
  .baer .outline, .baer canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .timer.gruen { --tfarbe: var(--gruen); }
  .timer.gelb { --tfarbe: var(--gelb); }
  .timer.rot { --tfarbe: var(--rot); }
  .timer.ende .zahl { animation: endePuls 0.8s ease-in-out infinite; }
  .timer.ende .fortschritt { filter: drop-shadow(0 0 1.4vh var(--rot)); }
  @keyframes endePuls {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.12); opacity: 0.55; }
  }
  .timer-label {
    font-size: 3vh;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--leise);
    min-height: 3.6vh;
  }
  .timer-label.ende { color: var(--rot); }

  .steuerung {
    position: relative;
    top: -1.5vh;
    display: flex;
    gap: 1.1vw;
    width: 86%;
  }
  .steuerung button {
    appearance: none;
    border: 0;
    flex: 1;
    min-height: 8.4vh;
    border-radius: 1.6vh;
    font-family: inherit;
    font-size: 2.6vh;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.2s ease, background 0.2s ease;
  }
  .steuerung button:active:not(:disabled) { transform: scale(0.97); }
  .steuerung button:disabled { opacity: 0.28; cursor: default; }
  #btn-zurueck, #btn-vor { background: #34343a; }
  #btn-start { flex: 1.3; background: var(--gruen); }
  #btn-start.pause { background: #c98a00; }
  #btn-start.neu { background: var(--header); }

  .fuss {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8vh;
  }
  #zaehler { font-size: 3vh; font-weight: 600; color: #a4a4ac; }
  .status-zeile {
    display: flex;
    gap: 2vw;
    font-size: 1.8vh;
    color: #7e7e86;
  }
  #presenter.bereit { color: #4dd27e; }
  #presenter.warte { color: #e0a800; }

  /* ---------- Rückfrage ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.78);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .overlay.offen { display: flex; }
  .dialog {
    width: 62vw;
    background: #1d1d21;
    border-radius: 2.4vh;
    padding: 6vh 4vw 5vh;
    box-shadow: 0 2vh 6vh rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.1);
  }
  .dialog p {
    margin: 0 0 4vh;
    font-size: 5.4vh;
    font-weight: 700;
    line-height: 1.25;
    text-align: center;
  }
  .dialog .knoepfe { display: flex; gap: 2vw; }
  .dialog button {
    appearance: none;
    border: 0;
    flex: 1;
    min-height: 11vh;
    border-radius: 2vh;
    font-family: inherit;
    font-size: 3.8vh;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
  }
  #dlg-abbrechen { background: #34343a; }
  #dlg-ja { background: var(--header); }
  .dialog .tipp { margin-top: 3vh; text-align: center; font-size: 2vh; color: #80808a; }

  /* ---------- Auswahlseite ---------- */
  .buehne[hidden] { display: none; }
  .auswahl {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 3.5vh;
    padding: 5vh 4vw 4vh;
  }
  .auswahl[hidden] { display: none; }
  .auswahl h1 { margin: 0 0 0.5vh; font-size: 5vh; font-weight: 800; letter-spacing: 0.02em; }
  .modi {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2vw;
    width: 92vw;
  }
  .modus {
    appearance: none;
    border: 0;
    text-align: left;
    border-radius: 2vh;
    padding: 3vh 2vw 3.4vh;
    background: var(--kachel);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    box-shadow: inset 0 0 0 0.3vh #2e2e34;
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
  }
  .modus:hover { background: #222226; }
  .modus:active { transform: scale(0.99); }
  .modus .kopf { display: flex; align-items: center; gap: 1.2vw; margin-bottom: 1.8vh; }
  .modus .buchstabe {
    flex: 0 0 auto;
    width: 6vh;
    height: 6vh;
    border-radius: 50%;
    background: #2e2e34;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.2vh;
    font-weight: 800;
  }
  .modus .titel { font-size: 3.4vh; font-weight: 800; line-height: 1.15; }
  .modus .beschr { font-size: 2.4vh; font-weight: 600; color: #d6d6db; line-height: 1.3; }
  .modus ol { margin: 0; padding-left: 1.6vw; font-size: 2vh; color: var(--leise); line-height: 1.45; }
  .modus ol li { margin-bottom: 0.6vh; }
  .modus.gewaehlt { background: var(--kachel-aktiv); box-shadow: inset 0 0 0 0.45vh #fff; }
  .modus.gewaehlt .buchstabe { background: var(--gruen); color: #0a0a0c; }
  .bdw { display: flex; flex-direction: column; align-items: center; gap: 1.4vh; }
  .bdw label { font-size: 2.6vh; font-weight: 700; color: #c4c4ca; }
  .dd { position: relative; min-width: 36vw; }
  .dd-knopf {
    width: 100%;
    appearance: none;
    text-align: left;
    font-family: inherit;
    font-size: 3.2vh;
    font-weight: 600;
    padding: 1.6vh 1.6vw;
    border: 0;
    border-radius: 1.6vh;
    background: var(--kachel);
    color: var(--text);
    box-shadow: inset 0 0 0 0.3vh #2e2e34;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 1vw;
  }
  .dd-knopf.gewaehlt { box-shadow: inset 0 0 0 0.45vh #fff; }
  .dd-knopf:disabled { opacity: 0.5; cursor: default; }
  .dd-panel {
    position: absolute;
    left: 0; right: 0; top: calc(100% + 0.8vh);
    z-index: 60;
    background: #1c1c20;
    border-radius: 1.6vh;
    box-shadow: 0 1vh 4vh rgba(0,0,0,0.6), inset 0 0 0 0.3vh #2e2e34;
    overflow-y: auto;
    padding: 0.8vh;
  }
  .dd-panel[hidden] { display: none; }
  .dd-eintrag {
    display: block;
    width: 100%;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 3vh;
    font-weight: 600;
    text-align: left;
    padding: 1.1vh 1.2vw;
    border-radius: 1vh;
    cursor: pointer;
  }
  .dd-eintrag:hover { background: #2c2c32; }
  .dd-eintrag.gewaehlt { background: #2c2c32; color: var(--gruen); }
  .bdw select {
    display: none;
    color-scheme: dark;
    min-width: 36vw;
    font-family: inherit;
    font-size: 3.2vh;
    font-weight: 600;
    padding: 1.6vh 1.6vw;
    border: 0;
    border-radius: 1.6vh;
    background: var(--kachel);
    color: var(--text);
    box-shadow: inset 0 0 0 0.3vh #2e2e34;
  }
  .bdw select.gewaehlt { box-shadow: inset 0 0 0 0.45vh #fff; }
  .bdw select:disabled { opacity: 0.5; }
  .auswahl .hinweis { font-size: 2vh; color: #7e7e86; }

  .pitch .tag {
    display: inline-block;
    margin-top: 0.9vh;
    padding: 0.4vh 1.1vh;
    border-radius: 1vh;
    background: rgba(245, 208, 0, 0.16);
    color: var(--gelb);
    font-size: 2vh;
    font-weight: 700;
  }
  .pitch.aktiv .tag { font-size: 2.5vh; }
</style>
</head>
<body>

<div class="auswahl" id="auswahl">
  <h1>Berlin Bär &middot; Pitch</h1>
  <div class="modi" id="modi">
    <button type="button" class="modus" data-modus="a">
      <div class="kopf"><span class="buchstabe">A</span><div class="beschr">Jeder Bär stellt den vorher eingecheckten Bären vor.</div></div>
      <ol>
        <li>Bären: jeder stellt den vorher eingecheckten Bären vor</li>
        <li>Vertreter für Bären, nach Eincheckzeit</li>
        <li>Besucher und Vertreter in eigener Sache, nach Eincheckzeit</li>
      </ol>
    </button>
    <button type="button" class="modus" data-modus="b">
      <div class="kopf"><span class="buchstabe">B</span><div class="beschr">Jeder Bär stellt den danach eingecheckten Bären vor.</div></div>
      <ol>
        <li>Bären: jeder stellt den danach eingecheckten Bären vor</li>
        <li>Vertreter für Bären, nach Eincheckzeit</li>
        <li>Besucher und Vertreter in eigener Sache, nach Eincheckzeit</li>
      </ol>
    </button>
    <button type="button" class="modus" data-modus="c">
      <div class="kopf"><span class="buchstabe">C</span><div class="beschr">Zufällige Reihenfolge der Bären und Vertretungen.</div></div>
      <ol>
        <li>Bären und Vertretungen für Bären in zufälliger Reihenfolge</li>
        <li>Besucher und Vertreter in eigener Sache, nach Eincheckzeit</li>
      </ol>
    </button>
  </div>
  <div class="bdw">
    <label for="bdw-select">Bär der Woche (60 Sekunden Pitchzeit)</label>
    <select id="bdw-select" disabled><option value="__leer" selected disabled>wird geladen…</option></select>
    <div class="dd" id="dd">
      <button type="button" class="dd-knopf" id="dd-knopf" disabled><span id="dd-text">wird geladen…</span><span>&#9662;</span></button>
      <div class="dd-panel" id="dd-panel" hidden></div>
    </div>
  </div>
  <div class="hinweis">Die Präsentation startet, sobald Modus und Bär der Woche gewählt sind.</div>
</div>

<div class="buehne" id="buehne" hidden>
  <div class="links">
    <div class="liste" id="liste"></div>
  </div>

  <div class="rechts">
    <div class="timer-block">
      <div class="timer gruen" id="timer">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="spur" cx="100" cy="100" r="90"></circle>
          <circle class="fortschritt" id="ring" cx="100" cy="100" r="90"></circle>

  var netzBild = null;       // ImageData (weiß), nur Alpha wird verändert
  var netzCtx = null;
  var letzterAnteil = -1;

  function ladeBild(uri, fertig) {
    var img = new Image();
    img.onload = function() { fertig(img); };
    img.src = uri;
  }

  function initialisiereNetz() {
    var canvas = document.getElementById('netz');
    netzCtx = canvas.getContext('2d');
    ladeBild(NETZ_URI, function(netzImg) {
      ladeBild(TIEFE_URI, function(tiefeImg) {
        var c1 = document.createElement('canvas');
        c1.width = NETZ_B; c1.height = NETZ_H;
        var x1 = c1.getContext('2d');
        x1.drawImage(netzImg, 0, 0, NETZ_B, NETZ_H);
        var nd = x1.getImageData(0, 0, NETZ_B, NETZ_H).data;

        var c2 = document.createElement('canvas');
        c2.width = NETZ_B; c2.height = NETZ_H;
        var x2 = c2.getContext('2d');
        x2.drawImage(tiefeImg, 0, 0, NETZ_B, NETZ_H);
        var dd = x2.getImageData(0, 0, NETZ_B, NETZ_H).data;

        var n = NETZ_B * NETZ_H;
        var idx = [];
        netzAlpha = new Uint8Array(n);
        netzTiefe = new Uint8Array(n);
        for (var i = 0; i < n; i++) {
          var a = nd[i * 4 + 3];
          if (a > 0) {
            netzAlpha[i] = a;
            netzTiefe[i] = dd[i * 4];
            idx.push(i);
          }
        }
        netzIndex = new Uint32Array(idx);
        netzBild = netzCtx.createImageData(NETZ_B, NETZ_H);
        for (var j = 0; j < n; j++) {
          netzBild.data[j * 4] = 255;
          netzBild.data[j * 4 + 1] = 255;
          netzBild.data[j * 4 + 2] = 255;
        }
        netzBereit = true;
        letzterAnteil = -1;
        zeichneNetz(1 - verbleibendMs / DAUER_MS);
      });
    });
  }

  // fortschritt: 0 = nur Outline, 1 = komplettes Netzwerk
  function zeichneNetz(fortschritt) {
    if (!netzBereit) return;
    var f = Math.max(0, Math.min(1, fortschritt));
    var q = Math.round(f * 600) / 600;
    if (q === letzterAnteil) return;
    letzterAnteil = q;
    var weich = 0.14;
    var grenze = q * (1 + weich);
    var daten = netzBild.data;
    for (var k = 0; k < netzIndex.length; k++) {
      var i = netzIndex[k];
      var m = (grenze - netzTiefe[i] / 255) / weich;
      if (m <= 0) m = 0; else if (m > 1) m = 1;
      daten[i * 4 + 3] = netzAlpha[i] * m;
    }
    netzCtx.putImageData(netzBild, 0, 0);
  }

  /* ---------- Timer ---------- */
  function zeichneTimer() {
    var timer = document.getElementById('timer');
    var sek = Math.ceil(verbleibendMs / 1000);
    if (sek < 0) sek = 0;
    document.getElementById('zahl').textContent = String(sek);

    var anteil = Math.max(0, Math.min(1, verbleibendMs / DAUER_MS));
    document.getElementById('ring').style.strokeDashoffset = String(RING_UMFANG * (1 - anteil));

    var farbe = 'gruen';
    if (sek <= 5) farbe = 'rot';
    else if (sek <= 10) farbe = 'gelb';
    timer.className = 'timer ' + farbe + (timerStatus === 'ende' ? ' ende' : '');

    zeichneNetz(1 - anteil);

    var label = document.getElementById('timer-label');
    var start = document.getElementById('btn-start');
    if (timerStatus === 'bereit') {
      label.textContent = DAUER_MS !== DAUER_STANDARD ? 'bereit · ' + Math.round(DAUER_MS / 1000) + ' Sekunden' : 'bereit';
      start.textContent = 'Start';
      start.className = '';
    }
    if (timerStatus === 'laeuft') { label.textContent = 'läuft'; start.textContent = 'Pause'; start.className = 'pause'; }
    if (timerStatus === 'pause') { label.textContent = 'pausiert'; start.textContent = 'Weiter'; start.className = ''; }
    if (timerStatus === 'ende') { label.textContent = 'Zeit ist um'; start.textContent = 'Neu starten'; start.className = 'neu'; }
    label.className = 'timer-label' + (timerStatus === 'ende' ? ' ende' : '');
  }

  function stoppeRaf() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  }

  function tick() {
    if (timerStatus !== 'laeuft') return;
    var rest = restBeiStart - (performance.now() - laufStart);
    if (rest <= 0) {
      verbleibendMs = 0;
      timerStatus = 'ende';
      zeichneTimer();
      return;
    }
    verbleibendMs = rest;
    zeichneTimer();
    rafId = requestAnimationFrame(tick);
  }

  function setzeTimerBereit() {
    stoppeRaf();
    timerStatus = 'bereit';
    verbleibendMs = DAUER_MS;
    zeichneTimer();
  }

  function starteTimer() {
    stoppeRaf();
    restBeiStart = verbleibendMs;
    laufStart = performance.now();
    timerStatus = 'laeuft';
    tick();
  }

  function pausiereTimer() {
    verbleibendMs = restBeiStart - (performance.now() - laufStart);
    if (verbleibendMs < 0) verbleibendMs = 0;
    stoppeRaf();
    timerStatus = 'pause';
    zeichneTimer();
  }

  function startKnopf() {
    if (timerStatus === 'bereit' || timerStatus === 'pause') starteTimer();
    else if (timerStatus === 'laeuft') pausiereTimer();
    else if (timerStatus === 'ende') { setzeTimerBereit(); starteTimer(); }
  }

  /* ---------- Liste ---------- */
  function baueFlach() {
    flach = [];
    gruppen.forEach(function(g) {
      g.items.forEach(function(it) { flach.push({ key: it.key, bdw: !!it.bdw }); });
    });
  }

  function bestimmeAktuell() {
    if (flach.length === 0) { aktuellerKey = null; aktuellerIndex = 0; return; }
    var idx = -1;
    if (aktuellerKey !== null) {
      for (var i = 0; i < flach.length; i++) {
        if (flach[i].key === aktuellerKey) { idx = i; break; }
      }
    }
    if (idx < 0) idx = Math.min(aktuellerIndex, flach.length - 1);
    aktuellerIndex = idx;
    aktuellerKey = flach[idx].key;
  }

  function baueListe() {
    var liste = document.getElementById('liste');
    liste.innerHTML = '';
    kacheln = [];
    var nr = 0;
    gruppen.forEach(function(g) {
      var titel = el('div', 'gruppe-titel');
      titel.appendChild(el('span', '', g.titel));
      titel.appendChild(el('span', 'anzahl', String(g.items.length)));
      liste.appendChild(titel);

      if (g.items.length === 0) {
        liste.appendChild(el('div', 'leer', 'Noch niemand eingecheckt.'));
      }

      g.items.forEach(function(it) {
        nr++;
        var k = el('div', 'pitch ' + (it.typ === 'vertretung' ? 'g-vertretungen' : (it.typ === 'gast' ? 'g-gaeste' : 'g-baeren')));
        k.appendChild(el('div', 'nr', String(nr)));
        var inhalt = el('div', 'inhalt');
        inhalt.appendChild(el('div', 'name', it.name));
        if (it.typ === 'baer' && it.vorgestelltVon) {
          var z = el('div', 'zeile2', 'wird vorgestellt von ');
          z.appendChild(el('strong', '', it.vorgestelltVon));
          inhalt.appendChild(z);
        } else if (it.typ === 'vertretung' && it.vertritt) {
          var z2 = el('div', 'zeile2', 'vertritt ');
          z2.appendChild(el('strong', '', it.vertritt));
          inhalt.appendChild(z2);
        }
        if (it.bdw) {
          inhalt.appendChild(el('div', 'tag', 'Bär der Woche · ' + Math.round(DAUER_BDW / 1000) + ' Sekunden'));
        }
        k.appendChild(inhalt);
        liste.appendChild(k);
        kacheln.push(k);
      });
    });
  }

  function zentriere(weich) {
    var k = kacheln[aktuellerIndex];
    if (!k) return;
    var c = document.getElementById('liste');
    // Aktiven Eintrag so weit oben platzieren, dass die 4 folgenden darunter sichtbar sind.
    var normal = null;
    for (var i = 0; i < kacheln.length; i++) {
      if (i !== aktuellerIndex) { normal = kacheln[i]; break; }
    }
    var slot = normal
      ? normal.offsetHeight + parseFloat(window.getComputedStyle(normal).marginBottom || 0)
      : k.offsetHeight;
    var y0 = c.clientHeight - (k.offsetHeight + 4 * slot + 0.03 * c.clientHeight);
    y0 = Math.max(y0, 0.08 * c.clientHeight);
    c.scrollTo({ top: k.offsetTop - y0, behavior: weich ? 'smooth' : 'auto' });
  }

  function aktualisiereAnsicht(weich) {
    for (var i = 0; i < kacheln.length; i++) {
      kacheln[i].classList.toggle('aktiv', i === aktuellerIndex);
      kacheln[i].classList.toggle('erledigt', i < aktuellerIndex);
    }
    var n = flach.length;
    document.getElementById('zaehler').textContent =
      n === 0 ? 'Noch keine Pitches' : 'Pitch ' + (aktuellerIndex + 1) + ' von ' + n;
    document.getElementById('btn-zurueck').disabled = (n === 0 || aktuellerIndex <= 0);
    document.getElementById('btn-vor').disabled = (n === 0 || aktuellerIndex >= n - 1);
    zentriere(weich);
  }

  function geheZu(index) {
    if (index < 0 || index > flach.length - 1) return;
    aktuellerIndex = index;
    aktuellerKey = flach[index].key;
    setzeDauerFuerAktuell();
    setzeTimerBereit();
    aktualisiereAnsicht(true);
  }

  /* ---------- Bedienung ---------- */
  var overlay = document.getElementById('overlay');
  function dialogOffen() { return overlay.classList.contains('offen'); }
  function oeffneDialog() { overlay.classList.add('offen'); }
  function schliesseDialog() { overlay.classList.remove('offen'); }

  function zurueckAnfrage() {
    if (aktuellerIndex > 0) oeffneDialog();
  }
  function zurueckBestaetigt() {
    schliesseDialog();
    geheZu(aktuellerIndex - 1);
  }

  // Presenter: erster Klick vorwärts startet den Timer, der nächste springt weiter.
  function vorPresenter() {
    if (timerStatus === 'bereit') {
      starteTimer();
    } else if (aktuellerIndex < flach.length - 1) {
      geheZu(aktuellerIndex + 1);
    } else {
      setzeTimerBereit();
    }
  }

  function klick(id, fn) {
    document.getElementById(id).addEventListener('click', function() {
      fn();
      this.blur();
    });
  }
  klick('btn-start', startKnopf);
  klick('btn-zurueck', zurueckAnfrage);
  klick('btn-vor', function() { geheZu(aktuellerIndex + 1); });
  klick('dlg-abbrechen', schliesseDialog);
  klick('dlg-ja', zurueckBestaetigt);

  var TASTEN_VOR = { 'PageDown': 1, 'ArrowRight': 1, 'ArrowDown': 1, ' ': 1, 'Enter': 1 };
  var TASTEN_ZURUECK = { 'PageUp': 1, 'ArrowLeft': 1, 'ArrowUp': 1 };

  document.addEventListener('keydown', function(ev) {
    var vor = TASTEN_VOR[ev.key] === 1;
    var zurueck = TASTEN_ZURUECK[ev.key] === 1;
    var esc = ev.key === 'Escape';
    if (!praesentation) return;
    if (!vor && !zurueck && !esc) return;
    ev.preventDefault();
    if (ev.repeat) return;

    if (dialogOffen()) {
      if (zurueck) zurueckBestaetigt();
      else schliesseDialog();
      return;
    }
    if (vor) vorPresenter();
    else if (zurueck) zurueckAnfrage();
  });

  /* ---------- Fokus-Anzeige (Presenter braucht Tastaturfokus) ---------- */
  function aktualisiereFokus() {
    var p = document.getElementById('presenter');
    if (document.hasFocus()) {
      p.className = 'bereit';
      p.textContent = 'Presenter bereit';
    } else {
      p.className = 'warte';
      p.textContent = 'einmal ins Fenster klicken';
    }
  }
  window.addEventListener('focus', aktualisiereFokus);
  window.addEventListener('blur', aktualisiereFokus);
  setInterval(aktualisiereFokus, 1000);
  aktualisiereFokus();

  /* ---------- Mauszeiger ausblenden ---------- */
  var mausTimer = 0;
  function mausGesehen() {
    document.body.classList.remove('ohne-maus');
    clearTimeout(mausTimer);
    mausTimer = setTimeout(function() { document.body.classList.add('ohne-maus'); }, 3000);
  }
  document.addEventListener('mousemove', mausGesehen);
  mausGesehen();

  window.addEventListener('resize', function() { zentriere(false); });

  /* ---------- Modi, Bär der Woche, Gruppenaufbau ---------- */
  var modus = null;
  var bdwName = '';
  var bdwGewaehlt = false;
  var praesentation = false;
  var rohGruppen = null;
  var stammlisteJson = '';
  var chaosReihenfolge = null;
  var startTimeout = 0;

  function normalisiere(s) { return String(s || '').trim().toLowerCase(); }

  function mischen(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Zufallsreihenfolge einmal würfeln und danach stabil halten.
  // Neue Einträge landen zufällig hinter der aktuellen Position.
  function chaosAnwenden(items) {
    var nachKey = {};
    items.forEach(function(it) { nachKey[it.key] = it; });
    if (chaosReihenfolge === null) {
      if (items.length === 0) return [];
      chaosReihenfolge = mischen(items.map(function(it) { return it.key; }));
    } else {
      chaosReihenfolge = chaosReihenfolge.filter(function(k) { return nachKey[k]; });
      var bekannt = {};
      chaosReihenfolge.forEach(function(k) { bekannt[k] = true; });
      items.forEach(function(it) {
        if (!bekannt[it.key]) {
          var start = chaosReihenfolge.indexOf(aktuellerKey) + 1;
          var pos = start + Math.floor(Math.random() * (chaosReihenfolge.length - start + 1));
          chaosReihenfolge.splice(pos, 0, it.key);
          bekannt[it.key] = true;
        }
      });
    }
    return chaosReihenfolge.map(function(k) { return nachKey[k]; });
  }

  function baueGruppen() {
    if (!rohGruppen) return [];
    var baeren = rohGruppen[0].items;
    var verts = rohGruppen[1].items;
    var gaeste = rohGruppen[2].items;
    var bdw = normalisiere(bdwName);
    var n = baeren.length;

    function baerItem(it, vorg) {
      return { key: it.key, typ: 'baer', name: it.name, vorgestelltVon: vorg, vertritt: '',
               bdw: bdw !== '' && normalisiere(it.name) === bdw };
    }
    function vertItem(it) {
      return { key: it.key, typ: 'vertretung', name: it.name, vorgestelltVon: '', vertritt: it.vertritt || '',
               bdw: bdw !== '' && normalisiere(it.vertritt) === bdw };
    }
    function gastItem(it) {
      return { key: it.key, typ: 'gast', name: it.name, vorgestelltVon: '', vertritt: '', bdw: false };
    }

    var vertListe = verts.map(vertItem);
    var gruppeGaeste = { id: 'gaeste', titel: 'Gäste und Vertreter in eigener Sache', items: gaeste.map(gastItem) };

    if (modus === 'a') {
      return [
        { id: 'baeren', titel: 'Bären', items: baeren.map(function(it, i) {
            return baerItem(it, n > 1 ? baeren[(i + 1) % n].name : '');
          }) },
        { id: 'vertretungen', titel: 'Vertretungen für Bären', items: vertListe },
        gruppeGaeste
      ];
    }
    if (modus === 'b') {
      return [
        { id: 'baeren', titel: 'Bären', items: baeren.map(function(it, i) {
            return baerItem(it, n > 1 ? baeren[(i - 1 + n) % n].name : '');
          }) },
        { id: 'vertretungen', titel: 'Vertretungen für Bären', items: vertListe },
        gruppeGaeste
      ];
    }
    var gemischt = baeren.map(function(it) { return baerItem(it, ''); }).concat(vertListe);
    return [
      { id: 'chaos', titel: 'Bären und Vertretungen (Zufallsreihenfolge)', items: chaosAnwenden(gemischt) },
      gruppeGaeste
    ];
  }

  function setzeDauerFuerAktuell() {
    var neu = (flach[aktuellerIndex] && flach[aktuellerIndex].bdw) ? DAUER_BDW : DAUER_STANDARD;
    if (neu !== DAUER_MS) {
      DAUER_MS = neu;
      if (timerStatus === 'bereit') {
        verbleibendMs = DAUER_MS;
        letzterAnteil = -1;
        zeichneTimer();
      }
    }
  }

  function aktualisiereAusRoh() {
    if (!praesentation || !rohGruppen) return;
    var g = baueGruppen();
    var json = JSON.stringify(g);
    if (json !== letzteDatenJson) {
      letzteDatenJson = json;
      gruppen = g;
      baueFlach();
      bestimmeAktuell();
      baueListe();
      setzeDauerFuerAktuell();
      aktualisiereAnsicht(false);
    }
  }

  /* ---------- Auswahlseite ---------- */
  function befuelleDropdown(liste) {
    var json = JSON.stringify(liste);
    if (json === stammlisteJson) return;
    stammlisteJson = json;
    var sel = document.getElementById('bdw-select');
    var vorher = sel.value;
    sel.innerHTML = '';
    var platzhalter = document.createElement('option');
    platzhalter.value = '__leer';
    platzhalter.disabled = true;
    platzhalter.textContent = 'Bär der Woche wählen…';
    sel.appendChild(platzhalter);
    var keiner = document.createElement('option');
    keiner.value = '__keiner';
    keiner.textContent = '– kein Bär der Woche –';
    sel.appendChild(keiner);
    liste.forEach(function(name) {
      var o = document.createElement('option');
      o.value = name;
      o.textContent = name;
      sel.appendChild(o);
    });
    var vorhanden = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === vorher) vorhanden = true;
    }
    sel.value = vorhanden ? vorher : '__leer';
    sel.disabled = false;
    baueDropdownPanel();
  }

  function baueDropdownPanel() {
    var sel = document.getElementById('bdw-select');
    var panel = document.getElementById('dd-panel');
    var knopf = document.getElementById('dd-knopf');
    panel.innerHTML = '';
    for (var i = 0; i < sel.options.length; i++) {
      var o = sel.options[i];
      if (o.disabled) continue;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'dd-eintrag' + (o.value === sel.value ? ' gewaehlt' : '');
      b.textContent = o.textContent;
      b.setAttribute('data-wert', o.value);
      panel.appendChild(b);
    }
    var cur = sel.options[sel.selectedIndex];
    document.getElementById('dd-text').textContent = cur ? cur.textContent : '';
    knopf.disabled = false;
  }

  (function() {
    var knopf = document.getElementById('dd-knopf');
    var panel = document.getElementById('dd-panel');
    knopf.addEventListener('click', function() {
      if (!panel.hidden) { panel.hidden = true; return; }
      var r = knopf.getBoundingClientRect();
      var rand = 0.03 * window.innerHeight;
      var unten = window.innerHeight - r.bottom - rand;
      var oben = r.top - rand;
      if (unten >= oben) {
        panel.style.top = 'calc(100% + 0.8vh)';
        panel.style.bottom = 'auto';
        panel.style.maxHeight = unten + 'px';
      } else {
        panel.style.top = 'auto';
        panel.style.bottom = 'calc(100% + 0.8vh)';
        panel.style.maxHeight = oben + 'px';
      }
      panel.hidden = false;
    });
    panel.addEventListener('click', function(ev) {
      var b = ev.target.closest ? ev.target.closest('.dd-eintrag') : null;
      if (!b) return;
      var sel = document.getElementById('bdw-select');
      sel.value = b.getAttribute('data-wert');
      panel.hidden = true;
      knopf.classList.add('gewaehlt');
      baueDropdownPanel();
      sel.dispatchEvent(new Event('change'));
    });
    document.addEventListener('click', function(ev) {
      if (!document.getElementById('dd').contains(ev.target)) panel.hidden = true;
    });
  })();

  function pruefeStart() {
    clearTimeout(startTimeout);
    if (modus && bdwGewaehlt && !praesentation) {
      startTimeout = setTimeout(startepraesentation, 450);
    }
  }

  function startepraesentation() {
    if (praesentation) return;
    praesentation = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    document.getElementById('auswahl').hidden = true;
    document.getElementById('buehne').hidden = false;
    letzteDatenJson = '';
    chaosReihenfolge = null;
    aktuellerKey = null;
    aktuellerIndex = 0;
    setzeTimerBereit();
    aktualisiereAusRoh();
    aktualisiereAnsicht(false);
    try { window.focus(); } catch (e) {}
    aktualisiereFokus();
  }

  var modusKnoepfe = document.querySelectorAll('.modus');
  for (var mk = 0; mk < modusKnoepfe.length; mk++) {
    modusKnoepfe[mk].addEventListener('click', function() {
      modus = this.getAttribute('data-modus');
      for (var q = 0; q < modusKnoepfe.length; q++) {
        modusKnoepfe[q].classList.toggle('gewaehlt', modusKnoepfe[q] === this);
      }
      pruefeStart();
    });
  }
  document.getElementById('bdw-select').addEventListener('change', function() {
    var v = this.value;
    bdwGewaehlt = (v !== '__leer');
    bdwName = (v === '__keiner' || v === '__leer') ? '' : v;
    this.classList.toggle('gewaehlt', bdwGewaehlt);
    pruefeStart();
  });

  /* ---------- Daten ---------- */
  function render(daten) {
    var d = new Date(daten.stand);
    document.getElementById('stand').textContent =
      'Stand ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    rohGruppen = daten.gruppen;
    if (daten.stammliste) befuelleDropdown(daten.stammliste);
    aktualisiereAusRoh();
  }

  function zeigeFehler(msg) {
    document.getElementById('stand').textContent = 'Fehler beim Laden: ' + msg;
  }

  var API_URL = 'https://script.google.com/macros/s/AKfycbxIgewaNll8ECQKO25jcC-dFAtsp1XWIXCuxGaG_EWN7rQGDUergAq6O7Cpr77ZBfy1zQ/exec';

  function ladeDaten() {
    fetch(API_URL + '?seite=pitch&format=json')
      .then(function(r) { return r.json(); })
      .then(render)
      .catch(function(err) { zeigeFehler(err.message); });
  }

  zeichneTimer();
  initialisiereNetz();
  ladeDaten();
  setInterval(ladeDaten, 10000);
</script>
